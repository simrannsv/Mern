<!DOCTYPE html>
<html>
<head>
  <title>Grades Table</title>
  <link rel="stylesheet" href="table2.css">
</head>
<body>

  <table>
    <tr>
      <th colspan="2">Subject</th>
      <th>John Doe</th>
      <th>Miriam Luther</th>
    </tr>
    <tr>
      <td class="subject" rowspan="2">Biology</td>
      <td class="type">Practical</td>
      <td>A</td>
      <td>A</td>
    </tr>
    <tr>
      <td class="type">Theory</td>
      <td>A+</td>
      <td>A</td>
    </tr>
    <tr>
      <td class="subject" rowspan="2">Chemistry</td>
      <td class="type">Practical</td>
      <td>B</td>
      <td>C</td>
    </tr>
    <tr>
      <td class="type">Theory</td>
      <td>A</td>
      <td>C+</td>
    </tr>
    <tr>
      <td class="subject" rowspan="2">Physics</td>
      <td class="type">Practical</td>
      <td>A</td>
      <td>A</td>
    </tr>
    <tr>
      <td class="type">Theory</td>
      <td>A-</td>
      <td>A-</td>
    </tr>
  </table>

</body>
</html>
